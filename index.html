// --- IMPROVED ACTIVE MUTE LISTENER ---
function checkMuteStatus(snapshot) {
  if (countdownInterval) clearInterval(countdownInterval);
  
  const data = snapshot.val() || {};
  const now = Date.now();
  
  // Get the name currently typed in their box
  const nameToCheck = usernameInput.value.trim();
  
  if (!nameToCheck) {
    muteOverlay.style.display = "none";
    messageInput.disabled = false;
    return;
  }

  // Look for their name in the database list
  const until = data[nameToCheck] || 0;

  if (until && now < until) {
    mutedUntil = until;
    muteOverlay.style.display = "flex"; // Show the red screen
    messageInput.disabled = true;       // Block typing

    countdownInterval = setInterval(() => {
      const currentTime = Date.now();
      const remaining = Math.max(0, Math.floor((mutedUntil - currentTime) / 1000));
      
      if (remaining <= 0) {
        clearInterval(countdownInterval);
        muteOverlay.style.display = "none";
        messageInput.disabled = false;
        mutedUntil = 0;
        // Clean up the database once the time expires
        mutesRef.child(nameToCheck).remove();
      } else {
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        countdown.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }
    }, 1000);
  } else {
    // If they aren't in the list, make sure the overlay is gone
    muteOverlay.style.display = "none";
    messageInput.disabled = false;
    mutedUntil = 0;
  }
}

// Keep this listener active so it catches changes instantly

// ---------------- HELPERS ----------------



function escapeHTML(str = "") {



  return str.replace(/[&<>"']/g, m => ({



    "&":"&amp;",



    "<":"&lt;",



    ">":"&gt;",



    '"':"&quot;",



    "'":"&#039;"



  }[m]));



}







function formatMarkdown(text = "") {



  if (text.startsWith("### ")) text = `<h3>${text.slice(4)}</h3>`;



  else if (text.startsWith("## ")) text = `<h2>${text.slice(3)}</h2>`;



  else if (text.startsWith("# ")) text = `<h1>${text.slice(2)}</h1>`;







  text = text.replace(/\*\*\*(.*?)\*\*\*/g, "<b><i>$1</i></b>");



  text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");



  text = text.replace(/\*(.*?)\*/g, "<i>$1</i>");



  text = text.replace(/~~(.*?)~~/g, "<strike>$1</strike>");



  return text;



}







function cleanText(t = "") {



  profanity.forEach(w => {



    const escaped = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");



    t = t.replace(new RegExp(escaped, "gi"), "****");



  });



  return t;



}







function showNotification(text) {



  const n = document.createElement("div");

}







// ---------------- MESSAGE RENDER ----------------

function addMessage(msg, key) {

  if (!msg || !msg.text) return;



  if (chatWindow.querySelector(`[data-key="${key}"]`)) return;



  const div = document.createElement("div");

  div.className = "message";

  div.dataset.key = key;



  const role = msg.role || "member";

  if (role === "owner") div.classList.add("owner-message");



  // Keep ONLY this one:

    year: 'numeric',

    month: 'short',

    day: 'numeric',

    hour: '2-digit',

    minute: '2-digit'

  });



  let badge = "";



  let nameStyle = "";



  let textStyle = "";







  if (role === "owner") {



    badge = "👑";



    nameStyle = 'style="color: gold; font-weight: 900"';



    textStyle = 'style="color: gold; font-weight: 600"';



  } else if (role === "admin") {



    badge = "⭐";



    nameStyle = 'style="color: gold; font-weight: 800"';



  } else if (role === "system") {



    badge = "⚙️";



    nameStyle = 'style="color: white; font-weight: 900"';



  }







  const formattedText = formatMarkdown(escapeHTML(msg.text));







  div.innerHTML = `



    <span class="message-time">${timeStr}</span>



    ${badge ? `<span>${badge}</span>` : ""}



    <span class="username" ${nameStyle}>${msg.username}:</span>



    <span ${textStyle}>${formattedText}</span>



  `;







  chatWindow.appendChild(div);



  chatWindow.scrollTop = chatWindow.scrollHeight;

  // --- UPDATED PERMISSION LOGIC ---
  const user = firebase.auth().currentUser;
  const loggedInEmail = user ? user.email.toLowerCase() : "";
  
  const checkOwner = loggedInEmail === "dragonvr@fire-breathing.com";
  const checkAdmin = ["michael@smj.com", "purple@not-magic.com"].includes(loggedInEmail);
  
  // Logic: You can delete if you are Owner, Admin, OR if the message username matches your current session name
  const isMyMessage = (msg.username === currentUsername && currentUsername !== "");

  const canDelete = checkOwner || 
                    (checkAdmin && role !== "system") || 
                    isMyMessage;

  if (canDelete) {
    const trash = document.createElement("span");
    trash.className = "trash-btn";
    trash.innerHTML = "🗑️"; 
    trash.onclick = () => openDeleteModal(key);
    div.appendChild(trash);
  }
}
  
// ---------------- REALTIME LISTENERS ----------------
let initialLoad = true;
messagesRef.limitToLast(50).on("child_added", snap => {
  addMessage(snap.val(), snap.key);
  
  // Logic to only scroll if user is already at the bottom or it's the first load
  const isNearBottom = chatWindow.scrollHeight - chatWindow.clientHeight <= chatWindow.scrollTop + 100;
  if (isNearBottom || initialLoad) {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }
});

messagesRef.once("value", () => { initialLoad = false; });

  const uid = user?.uid || "guest";
  const email = user?.email?.toLowerCase() || "";
  const name = usernameInput.value.trim();

  // --- COMMAND PARSER (Discord Style) ---
  if (text.startsWith("/timeout") && (role === "owner" || role === "admin")) {
    const parts = text.split(" "); 
    // Format: /timeout username duration (or 'cancel')
    const targetUser = parts[1];
    const durationArg = parts[2];

    if (!targetUser) {
      showNotification("Usage: /timeout (user) (minutes/cancel)");
    } else if (durationArg === "cancel") {
      mutesRef.child(targetUser).remove();
      showNotification(`${targetUser} has been unmuted.`);
    } else {
      const minutes = parseInt(durationArg);
      if (isNaN(minutes)) {
        showNotification("Please provide a valid number of minutes.");
      } else {
        const until = now + (minutes * 60 * 1000);
        mutesRef.child(targetUser).set(until);

  if (role === "member" && now - lastMessageTime < COOLDOWN_MS)

  messagesRef.push({
    uid,
    username: name,
    text: role === "member" ? cleanText(text) : text,
    role,
    time: now
  });

  messageInput.value = "";
  lastMessageTime = now;

// ---------------- TYPING ----------------



function setTyping(state) {



  if (!currentUsername) return;







  const typingId = auth.currentUser?.uid || `guest_${currentUsername}`;



  const ref = typingRef.child(typingId);







  if (state) {



    ref.set({ username: currentUsername, time: Date.now() });







    if (typingTimeout) clearTimeout(typingTimeout);



    typingTimeout = setTimeout(() => setTyping(false), 3000);



  } else {



    ref.remove();



  }



}

systemMessageInput.addEventListener("keydown", e => {



  if (e.key === "Enter") {



    e.preventDefault();



    sendSystemMessage();



  }



});







messageInput.addEventListener("blur", () => setTyping(false));



// --- FIXED USERNAME & MUTE LOGIC --- 
usernameInput.addEventListener("change", () => {
  const newName = usernameInput.value.trim();
  if (newName !== currentUsername) {
    currentUsername = newName;
    // Trigger a re-check of the mute list for the new name
    mutesRef.once("value", checkMuteStatus);
  }
});

// Trigger check if they press enter in the name box
usernameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const newName = usernameInput.value.trim();
    currentUsername = newName;
    mutesRef.once("value", checkMuteStatus);
  }
});

// Typing listener (Existing)
typingRef.on("value", snap => {
  const data = snap.val() || {};
  const now = Date.now();

  const users = Object.values(data)
    .filter(u => u.time && now - u.time < 5000 && u.username !== currentUsername)
    .map(u => u.username);

  if (!users.length) {
    typingIndicator.style.visibility = "hidden";
    return;
  }

  typingIndicator.style.visibility = "visible";
  typingText.textContent =
    users.join(", ") + (users.length === 1 ? " is typing..." : " are typing...");
});

// ---------------- SYSTEM MESSAGE ----------------



function sendSystemMessage() {



  if (!isOwner) return;







  const text = systemMessageInput.value.trim();



  if (!text) return;



  messagesRef.push({

    uid: "system",

    username: "System",

    text,

    role: "system",

    time: Date.now()

  });



  systemMessageInput.value = "";

}



// ---------------- LOGIN ----------------

ownerLoginBtn.onclick = () => {

  auth.signInWithEmailAndPassword(ownerEmail.value, ownerPassword.value)

    .catch(err => showNotification(err.message));

};



// ---------------- LOGOUT ----------------

logoutBtn.onclick = () => {

  auth.signOut().then(() => {

    // Manually reset permissions so the UI updates without a refresh

    isOwner = false;

    isAdmin = false;

    currentUsername = "";

    usernameInput.value = "";

    showNotification("Logged out successfully");

  });

};

</script>
