// ---------------- HELPERS ----------------



function escapeHTML(str = "") {



  return str.replace(/[&<>"']/g, m => ({



    "&":"&amp;",



    "<":"&lt;",



    ">":"&gt;",



    '"':"&quot;",



    "'":"&#039;"



  }[m]));



}







function formatMarkdown(text = "") {



  if (text.startsWith("### ")) text = `<h3>${text.slice(4)}</h3>`;



  else if (text.startsWith("## ")) text = `<h2>${text.slice(3)}</h2>`;



  else if (text.startsWith("# ")) text = `<h1>${text.slice(2)}</h1>`;







  text = text.replace(/\*\*\*(.*?)\*\*\*/g, "<b><i>$1</i></b>");



  text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");



  text = text.replace(/\*(.*?)\*/g, "<i>$1</i>");



  text = text.replace(/~~(.*?)~~/g, "<strike>$1</strike>");



  return text;



}







function cleanText(t = "") {



  profanity.forEach(w => {



    const escaped = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");



    t = t.replace(new RegExp(escaped, "gi"), "****");



  });



  return t;



}

// --- FIXED: Message Rendering with Role memory ---
function addMessage(msg, key) {
  if (!msg || !msg.text || chatWindow.querySelector(`[data-key="${key}"]`)) return;

  const div = document.createElement("div");
  let replyHTML = "";

if (msg.reply) {
  replyHTML = `
    <div style="
      border-left: 3px solid #ff4500;
      padding-left: 6px;
      margin-bottom: 5px;
      font-size: 0.8rem;
      color: #ccc;
    ">
      ↪ ${msg.reply.username}: ${msg.reply.text}
    </div>
  `;
}
  div.className = "message";
  div.dataset.key = key;
  div.dataset.authorUid = msg.uid; 
  div.dataset.role = msg.role || "member"; // STORE THE ROLE HERE

  const role = msg.role || "member";
  if (role === "owner") div.classList.add("owner-message");

  const dateObj = new Date(msg.time);
  const datePart = dateObj.toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  const timePart = dateObj.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  const timeStr = `${datePart} • ${timePart}`;
  
  let badge = "";
  let nameStyle = "";

  else if (role === "admin") { badge = "⭐"; nameStyle = 'style="color: gold; font-weight: 800"'; }
  else if (role === "system") { badge = "⚙️"; nameStyle = 'style="color: white; font-weight: 900"'; }

  div.innerHTML = `
    <span class="message-time">${timeStr}</span>
    ${replyHTML}
    <div style="display: inline-block; width: 100%;">
      ${badge ? `<span style="display: inline; margin-right: 5px;">${badge}</span>` : ""}
      <span class="username" ${nameStyle}>${msg.username}:</span>
      <span style="white-space: pre-wrap;">${formatMarkdown(escapeHTML(msg.text))}</span>
    </div>
  `;
  
  chatWindow.appendChild(div);
  injectTrashIcon(div, msg.uid, role);
}

// --- FIXED: Permission Logic for Members ---
function injectTrashIcon(messageDiv, authorUid, role) {
  const user = firebase.auth().currentUser;
  const key = messageDiv.dataset.key;

  const isMyMessage =
    (user && authorUid === user.uid) ||
    (authorUid === sessionGuestId);

  const reply = document.createElement("span");

  };

    document.getElementById("replyText").innerText =
      `${replyTarget.username}: ${replyTarget.text}`;
  };

  messageDiv.appendChild(reply);

  let canDelete = false;

// Owner can delete EVERYTHING

}

// Everyone else only deletes their own
else {

// --- FIXED: UI Refresh using stored data attributes ---
function refreshPermissionsUI() {
  const messages = chatWindow.querySelectorAll('.message');

    const role = div.dataset.role; // Pull the real role from the attribute
    injectTrashIcon(div, authorUid, role);
  });
}

// --- FIXED: Active Mute Listener ---
function checkMuteStatus() {
    if (countdownInterval) clearInterval(countdownInterval);
    
    // Check if current user (Auth or Guest) is in the mute list
    const myUid = firebase.auth().currentUser?.uid || sessionGuestId;
    
    mutesRef.child(myUid).on("value", snapshot => {
        const muteTime = snapshot.val();
        const now = Date.now();

        if (muteTime && now < muteTime) {
            mutedUntil = muteTime;
            muteOverlay.style.setProperty('display', 'flex', 'important'); //
            messageInput.disabled = true;
            messageInput.blur();

            countdownInterval = setInterval(() => {
                const currentTime = Date.now();
                const remaining = Math.max(0, Math.floor((mutedUntil - currentTime) / 1000));
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    muteOverlay.style.setProperty('display', 'none', 'important');
                    messageInput.disabled = false;
                    mutedUntil = 0;
                    mutesRef.child(myUid).remove();
                } else {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    countdown.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            }, 1000);
        } else {
            muteOverlay.style.setProperty('display', 'none', 'important');
            messageInput.disabled = false;
            mutedUntil = 0;
        }
    });
}
  
// Re-run mute check whenever the database updates
mutesRef.on("value", checkMuteStatus);
  
// ---------------- REALTIME LISTENERS ----------------
let initialLoad = true;

// Fetch the initial batch first to avoid the "jumping" during load

});

    // Fix: Only set default name if the input is currently empty
    if (!usernameInput.value.trim()) {
      currentUsername = user.email.split('@')[0];
      usernameInput.value = currentUsername;
    }

    mutesRef.once("value", checkMuteStatus);
  } else {
    isOwner = false;
    isAdmin = false;
    currentUsername = "";
    usernameInput.value = "";
  }

  // Refresh trash icons for existing messages upon login/logout
  refreshPermissionsUI();

  const showSystem = isOwner && user;
  systemMessageInput.style.display = showSystem ? "inline-block" : "none";
  systemSendBtn.style.display = showSystem ? "inline-block" : "none";
});
  
// ---------------- DELETE MODAL ----------------



function openDeleteModal(key) {
  messageToDeleteKey = key;
  deleteModal.style.display = "block";
}

function closeDeleteModal() {



  deleteModal.style.display = "none";



  messageToDeleteKey = null;



}

confirmDelete.onclick = () => {
  if (!messageToDeleteKey) return;

  const messageEl = document.querySelector(
    `[data-key="${messageToDeleteKey}"]`
  );

  if (!messageEl) {
    showNotification("Message not found.");
    closeDeleteModal();
    return;
  }

  const authorUid = messageEl.dataset.authorUid;
  const role = messageEl.dataset.role;

  const user = firebase.auth().currentUser;

  const myUid = user?.uid || sessionGuestId;

  let allowed = false;

// Owner can delete everything
if (isOwner) {
  allowed = true;
}

// Everyone else only their own
else if (authorUid === myUid) {
  allowed = true;
}

  if (!allowed) {
    showNotification("Permission denied.");
    closeDeleteModal();
    return;
  }

  messagesRef.child(messageToDeleteKey).remove()
    .then(() => {
      showNotification("Message deleted");
      closeDeleteModal();
    })
    .catch(err => {
      showNotification("Delete failed: " + err.message);
    });
};

// ---------------- SEND MESSAGE ----------------
chatForm.onsubmit = e => {
  e.preventDefault();

  const user = auth.currentUser;
  const uid = user ? user.uid : sessionGuestId; 
  
  const name = usernameInput.value.trim();
  const text = messageInput.value.trim();
  const now = Date.now();
  
  currentUsername = name;

  // FIX: Use the globally updated state variables
  let role = "member";
  if (isOwner) role = "owner";
  else if (isAdmin) role = "admin";

  // --- COMMAND PARSER ---
  if (text.startsWith("/timeout") && (role === "owner" || role === "admin")) {
    const rawContent = text.replace("/timeout", "").trim();
    const lastSpaceIndex = rawContent.lastIndexOf(" ");
    
    // Check if the user provided enough arguments
    if (lastSpaceIndex === -1) {
      showNotification("Usage: /timeout (user) (minutes/cancel)");
    } else {
      const targetUser = rawContent.slice(0, lastSpaceIndex).trim();
      const durationArg = rawContent.slice(lastSpaceIndex).trim().toLowerCase();

      // Find the most recent message from this username to get their UID
      messagesRef.orderByChild("username").equalTo(targetUser).limitToLast(1).once("value", snap => {
        const data = snap.val();
        if (data) {
          const targetKey = Object.keys(data)[0];
          const entry = Object.values(data)[0];
          
          const targetRole = entry?.role || "member";

      // Admins can ONLY timeout members
        if (isAdmin && targetRole !== "member") {
        showNotification("Admins can only timeout members.");
        return;
      }
          
          if (durationArg === "cancel") {
            // REMOVE the mute entry from Firebase
            mutesRef.child(targetUid).remove()
              .then(() => showNotification(`${targetUser} has been unmuted.`))
              .catch(err => showNotification("Error: " + err.message));
          } else {
            const minutes = parseInt(durationArg);
            if (isNaN(minutes)) {
              showNotification("Please provide a number of minutes or 'cancel'.");
            } else {
              const until = Date.now() + (minutes * 60 * 1000);
              mutesRef.child(targetUid).set(until)
                .then(() => showNotification(`${targetUser} timed out for ${minutes}m.`))
                .catch(err => showNotification("Mute failed: " + err.message));
            }
          }
        } else {
          showNotification(`User '${targetUser}' not found in recent history.`);
        }
      });
    }
    messageInput.value = ""; 
    return; 
  }

  // --- REGULAR MESSAGE LOGIC ---
  if (now < mutedUntil) return showNotification("You are muted");

  if (role === "member" && now - lastMessageTime < COOLDOWN_MS)
    return showNotification("Slow down");

  messagesRef.push({
  uid,
  username: name,
  text: role === "member" ? cleanText(text) : text,
  role,
  time: now,
  reply: replyTarget ? { ...replyTarget } : null
});

  messageInput.value = "";
lastMessageTime = now;

// ALWAYS fully reset reply state
replyTarget = null;
const preview = document.getElementById("replyPreview");
if (preview) preview.style.display = "none";
};
  
// ---------------- TYPING ----------------



function setTyping(state) {



  if (!currentUsername) return;







  const typingId = auth.currentUser?.uid || `guest_${currentUsername}`;



  const ref = typingRef.child(typingId);







  if (state) {



    ref.set({ username: currentUsername, time: Date.now() });







    if (typingTimeout) clearTimeout(typingTimeout);



    typingTimeout = setTimeout(() => setTyping(false), 3000);



  } else {



    ref.remove();



  }



}







let typingThrottle = false;







messageInput.addEventListener("input", () => {



  if (typingThrottle) return;



  typingThrottle = true;







  setTyping(true);







  setTimeout(() => {



    typingThrottle = false;



  }, 1500);



});







systemSendBtn.onclick = sendSystemMessage;







systemMessageInput.addEventListener("keydown", e => {



  if (e.key === "Enter") {



    e.preventDefault();



    sendSystemMessage();



  }



});







messageInput.addEventListener("blur", () => setTyping(false));



// --- CONSOLIDATED USERNAME & MUTE LOGIC --- 
const handleUsernameChange = () => {
    const newName = usernameInput.value.trim();
    if (newName !== currentUsername) {
        currentUsername = newName;
        // Only ping the database once the user stops typing for 500ms
        clearTimeout(window.muteCheckTimeout);
        window.muteCheckTimeout = setTimeout(() => {
            mutesRef.once("value", checkMuteStatus);
        }, 500);
    }
};

usernameInput.addEventListener("input", handleUsernameChange);

usernameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        handleUsernameChange();
    }
});

// Typing listener (Corrected to avoid self-detection)
typingRef.on("value", snap => {
    const data = snap.val() || {};
    const now = Date.now();
    const myUid = auth.currentUser?.uid || `guest_${currentUsername}`;

    const users = Object.entries(data)
        .filter(([id, u]) => id !== myUid && u.time && now - u.time < 5000)
        .map(([id, u]) => u.username);

    if (!users.length) {
        typingIndicator.style.visibility = "hidden";
        return;
    }

    typingIndicator.style.visibility = "visible";
    typingText.textContent =
        users.join(", ") + (users.length === 1 ? " is typing..." : " are typing...");
});

// ---------------- SYSTEM MESSAGE ----------------



function sendSystemMessage() {



  if (!isOwner) return;







  const text = systemMessageInput.value.trim();



  if (!text) return;



  messagesRef.push({

    uid: "system",

    username: "System",

    text,

    role: "system",

    time: Date.now()

  });



  systemMessageInput.value = "";

}



// ---------------- LOGIN ----------------

ownerLoginBtn.onclick = () => {

  auth.signInWithEmailAndPassword(ownerEmail.value, ownerPassword.value)

    .catch(err => showNotification(err.message));

};



// ---------------- LOGOUT ----------------
logoutBtn.onclick = () => {
  if (!auth.currentUser) {
    showNotification("You're already logged out, dum–dum.");
    return;
  }

  auth.signOut().then(() => {
    isOwner = false;
    isAdmin = false;
    currentUsername = "";
    usernameInput.value = "";

    showNotification("Logged out successfully");
  });
};

</script>
